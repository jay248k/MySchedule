<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="My Schedule — Personal Productivity Dashboard. Organize daily tasks, manage monthly schedules, track progress, and plan your time efficiently." />
  <title>My Schedule — Personal Productivity Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <script>
    (function () {
      try {
        var local = localStorage.getItem('myschedule_user_settings');
        var theme = 'dark';
        if (local) {
          var p = JSON.parse(local);
          if (p && p.theme) theme = p.theme;
        } else {
          var direct = localStorage.getItem('myschedule_theme');
          if (direct) theme = direct;
        }
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        if (theme === 'dark' || theme === 'oled') {
          root.classList.add('dark-mode');
        } else {
          root.classList.remove('dark-mode');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
